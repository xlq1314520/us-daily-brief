name: debug-net
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe endpoints
        run: |
          probe() { echo "=== $1"; curl -sL -m 45 -o /tmp/body -w "HTTP %{http_code} %{size_download}B" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" "$1"; echo; head -c 300 /tmp/body; echo; }
          probe "https://redlib.perennialte.ch/r/news/top.rss?t=day"
          probe "https://redlib.tux.pizza/r/news/top.rss?t=day"
          probe "https://safereddit.com/r/news/top.rss?t=day"
          probe "https://redlib.privacyredirect.com/r/news/top.rss?t=day"
          probe "https://trumpstruth.org/"
          probe "https://factba.se/topic/trump-social"
          probe "https://r.jina.ai/https://trumpstruth.org/"
          probe "https://www.presidency.ucsb.edu/"
