name: debug-net
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: dump full google trends rss b64
        run: |
          { echo "=== b64-begin"; curl -sL -m 40 -A "Mozilla/5.0" "https://trends.google.com/trending/rss?geo=US" | base64 -w 100; echo "=== b64-end"; } || true
          exit 0
