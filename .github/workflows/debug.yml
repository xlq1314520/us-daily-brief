name: debug-net
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: dump wksst format
        run: |
          { echo "=== head-begin"; curl -sL -m 40 "https://www.cpc.ncep.noaa.gov/data/indices/wksst.for" -o /tmp/w.txt && head -12 /tmp/w.txt 2>/dev/null; head -12 /tmp/w.txt 2>/dev/null; head -12 /tmp/w.txt; echo "=== head-end"; echo "=== tail-begin"; tail -30 /tmp/w.txt; echo "=== tail-end"; wc -l /tmp/w.txt; } || true
          exit 0
