name: debug-net
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe endpoints
        run: |
          probe() { echo "=== $1"; curl -sL -m 40 -o /tmp/body -w "HTTP %{http_code} %{size_download}B" "$1" || true; echo; head -c ${2:-400} /tmp/body; echo; }
          probe "https://api.allorigins.win/raw?url=https%3A%2F%2Fwww.reddit.com%2Fr%2Fnews%2Ftop.rss%3Ft%3Dday" 800
          probe "https://api.allorigins.win/raw?url=https%3A%2F%2Fold.reddit.com%2Fr%2Fnews%2Ftop.rss%3Ft%3Dday" 800
          echo "=== trumpstruth full html"; curl -sL -m 40 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" "https://trumpstruth.org/" -o /tmp/tt.html && wc -c /tmp/tt.html && grep -oE "statuses/[0-9]+|datetime=\"[^\"]*\"|<time[^>]*>|class=\"[^\"]*(status|post|date)[^\"]*\"" /tmp/tt.html | sort | uniq -c | sort -rn | head -30
