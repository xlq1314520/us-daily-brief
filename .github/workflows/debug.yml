name: debug-net
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe feeds2
        run: |
          probe() { echo "=== $1"; curl -sL -m 25 -A "Mozilla/5.0" -o /tmp/f.xml -w "HTTP %{http_code} %{size_download}B" "$1" || true; echo; head -c 150 /tmp/f.xml; echo; echo "items: $(grep -c "<item" /tmp/f.xml)"; }
          echo "=== CNN structure"; curl -sL -m 25 "http://rss.cnn.com/rss/edition.rss" -o /tmp/cnn.xml && grep -oE "<entry|<item" /tmp/cnn.xml | sort | uniq -c
          probe "https://www.chinadaily.com.cn/rss/cndy_rss.xml"
          probe "https://www.chinadaily.com.cn/rss/world_rss.xml"
          probe "http://www.xinhuanet.com/english/rss/china.xml"
          probe "https://www.cgtn.com/rss/"
          exit 0
