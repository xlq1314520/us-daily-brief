name: debug-net
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: find weekly data hrefs
        run: |
          { curl -sL -m 40 "https://www.cpc.ncep.noaa.gov/data/indices/" -o /tmp/idx.html; echo "=== hrefs"; grep -oiE "href=\"[^\"]*\"" /tmp/idx.html | grep -iE "sst|nino|oisst|wk|week" ; echo "=== context"; grep -oiE ".{160}Weekly (Relative )?OISST.{120}" /tmp/idx.html | head -4; } || true
          exit 0
